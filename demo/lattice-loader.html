<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lattice Loader · 手测</title>
<!--
  @szyyw/design Lattice Loader 的静态手测页（不进 package files）。
  仓库根目录 `python3 -m http.server 8080`，打开 http://localhost:8080/demo/lattice-loader.html
  ?scheme=light|dark&palette=aurora 可直接指定明暗 / 配色（截图用）；页内也有切换按钮。
-->
<script>
  (function () {
    var d = document.documentElement, q = new URLSearchParams(location.search);
    var s = q.get("scheme"), p = q.get("palette");
    if (s === "auto" || s === "dark" || s === "light") d.setAttribute("data-scheme", s);
    if (p && p !== "default") d.setAttribute("data-palette", p);
  })();
</script>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>
  .demo { max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }
  .demo > section { padding: 18px 20px; margin-bottom: 16px; }
  .demo h2 { margin: 0 0 4px; font-size: 15px; }
  .demo .note { margin: 0 0 14px; font-size: 12px; color: var(--text-dim); }
  .demo .grid2 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .demo .log { font-size: 12px; color: var(--text-dim); margin-top: 10px; min-height: 1.4em; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="bg-layer" aria-hidden="true"></div>
<div class="app-frame">
  <main class="demo">
    <h1 class="page-title grad-text">Lattice Loader</h1>
    <div class="toolbar">
      <button class="btn-ghost btn-small" data-set="scheme:light">浅色</button>
      <button class="btn-ghost btn-small" data-set="scheme:dark">深色</button>
      <button class="btn-ghost btn-small" data-set="palette:default">默认配色</button>
      <button class="btn-ghost btn-small" data-set="palette:aurora">aurora</button>
    </div>

    <section class="glass">
      <h2>状态切换</h2>
      <p class="note">方格波浪 + 实时秒表；完成 / 失败时拼成 ✓ / ✕ 并定格用时。用来替代「加载中…」。</p>
      <div style="font-size:16px"><span id="main"></span></div>
      <div class="actions" style="margin-top:12px">
        <button class="btn-ghost btn-small" data-s="working">重新开始</button>
        <button class="btn-ghost btn-small" data-s="done">完成</button>
        <button class="btn-ghost btn-small" data-s="error">失败</button>
      </div>
    </section>
    <section class="glass">
      <h2>图案（grid 3 / 4）</h2>
      <div class="grid2" id="pats"></div>
    </section>
    <section class="glass">
      <h2>选项</h2>
      <div class="grid2" id="opts"></div>
    </section>
  </main>
</div>
<script>
  document.querySelectorAll("[data-set]").forEach(function (b) {
    b.addEventListener("click", function () {
      var kv = b.dataset.set.split(":"), d = document.documentElement;
      if (kv[1] === "default") d.removeAttribute("data-" + kv[0]);
      else d.setAttribute("data-" + kv[0], kv[1]);
    });
  });
</script>
<script type="module">
  import { mountLatticeLoader } from "../lattice-loader.js";
  const main = mountLatticeLoader(document.getElementById("main"), { label: "正在生成回答", doneLabel: "完成，用时", errorLabel: "失败，用时", fontSize: 15, cellSize: 7 });
  for (const b of document.querySelectorAll("[data-s]")) b.onclick = () => main.set({ status: b.dataset.s });
  const pats = document.getElementById("pats");
  const names3 = ["orbit", "arrow", "dots", "ripple", "spiral", "snake"];
  const names4 = ["orbit", "snake", "sweep", "spin", "rain", "pulse"];
  for (const n of names3) { const e = document.createElement("div"); pats.appendChild(e); mountLatticeLoader(e, { label: n + " · 3", pattern: n, grid: 3, showTimer: false }); }
  for (const n of names4) { const e = document.createElement("div"); pats.appendChild(e); mountLatticeLoader(e, { label: n + " · 4", pattern: n, grid: 4, showTimer: false }); }
  const o = document.getElementById("opts");
  const add = (opts) => { const e = document.createElement("div"); o.appendChild(e); return mountLatticeLoader(e, opts); };
  add({ label: "方形格 + 光晕", shape: "square", glow: true });
  add({ label: "强调色 / 大格", color: "--accent", cellSize: 9, gap: 3, grid: 4, pattern: "sweep" });
  add({ label: "elapsed 外部控制 12.3s", elapsed: 12.3 });
  add({ label: "自定义图案", pattern: { cells: [0, 1, 2, 1, 2, 3, 2, 3, 4], loop: 8, scale: 1 } });
  add({ status: "done", doneLabel: "已完成，用时", elapsed: 4.2 });
  add({ status: "error", errorLabel: "失败，用时", elapsed: 9.8, grid: 4, pattern: "pulse" });
</script>
</body>
</html>
