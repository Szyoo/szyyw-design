<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>滑块分段 · 手测</title>
<!-- 手测页（不进 package files）：仓库根目录 python3 -m http.server 8080，打开 http://localhost:8080/demo/tabs.html
     ?js=0 不挂 tabs.js（纯 CSS 退化）；?scheme=light 浅色 -->
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>
  .demo { max-width: 860px; margin: 0 auto; padding: 24px 16px 120px; }
  .demo h2 { font-size: 15px; margin: 28px 0 10px; color: var(--text-dim); font-weight: 600; }
  .demo .glass { padding: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .narrow { max-width: 300px; }
</style>
</head>
<body>
<main class="demo">
  <div class="row">
    <button class="btn" id="scheme" type="button">切换明暗</button>
    <span class="hint" id="mode"></span>
  </div>

  <h2>.tabs（role="tab" + aria-selected，图标 + 文字）</h2>
  <div class="tabs" role="tablist" id="t-icons">
    <button class="tab" role="tab" aria-selected="true" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8Z"/><circle cx="8" cy="8" r="2"/></svg>Preview</button>
    <button class="tab" role="tab" aria-selected="false" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m5.5 4.5-3.5 3.5 3.5 3.5M10.5 4.5l3.5 3.5-3.5 3.5"/></svg>Code</button>
    <button class="tab" role="tab" aria-selected="false" type="button">设置</button>
    <button class="tab" role="tab" aria-selected="false" type="button" disabled>停用</button>
  </div>

  <h2>.tabs（.active，类名切换）</h2>
  <nav class="tabs" id="t-active">
    <a class="tab active" href="#a">总览</a>
    <a class="tab" href="#b">明细</a>
    <a class="tab" href="#c">一个较长的标签名</a>
    <a class="tab" href="#d" hidden>隐藏</a>
  </nav>

  <h2>.tabs.compact</h2>
  <div class="tabs compact" role="tablist" id="t-compact">
    <button class="tab" role="tab" aria-selected="false" type="button">日</button>
    <button class="tab" role="tab" aria-selected="true" type="button">周</button>
    <button class="tab" role="tab" aria-selected="false" type="button">月</button>
  </div>

  <h2>.tabs.scroll（窄容器，横滚）</h2>
  <div class="glass narrow">
    <div class="tabs scroll" role="tablist" id="t-scroll"></div>
  </div>

  <h2>.seg（aria-pressed）· .seg.compact</h2>
  <div class="row">
    <div class="seg" id="s-main">
      <button type="button" aria-pressed="true">股票</button>
      <button type="button" aria-pressed="false">基金</button>
      <button type="button" aria-pressed="false">债券</button>
    </div>
    <div class="seg compact" id="s-compact">
      <button type="button" class="active">列表</button>
      <button type="button">网格</button>
    </div>
  </div>

  <h2>动态插入 / React 式只改 aria-selected</h2>
  <div class="row">
    <button class="btn ghost" id="add" type="button">插入一条标签栏</button>
    <button class="btn ghost" id="rename" type="button">改选中项文字</button>
  </div>
  <div id="dyn"></div>

  <h2>玻璃卡内</h2>
  <div class="glass">
    <div class="tabs" role="tablist" id="t-glass">
      <button class="tab" role="tab" aria-selected="true" type="button">账户</button>
      <button class="tab" role="tab" aria-selected="false" type="button">安全</button>
      <button class="tab" role="tab" aria-selected="false" type="button">通知</button>
    </div>
  </div>
</main>
<script type="module">
  const q = new URLSearchParams(location.search);
  const html = document.documentElement;
  html.dataset.scheme = q.get("scheme") || "dark";
  document.getElementById("scheme").onclick = () => {
    html.dataset.scheme = html.dataset.scheme === "light" ? "dark" : "light";
  };

  const scroll = document.getElementById("t-scroll");
  ["全部", "食品", "交通", "住房", "娱乐", "医疗", "教育", "其他"].forEach((t, i) => {
    const b = document.createElement("button");
    b.className = "tab"; b.type = "button"; b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(i === 0)); b.textContent = t;
    scroll.append(b);
  });

  // 应用侧的选中逻辑（包不管选中态）：role=tab 改 aria-selected；.active 改类名；.seg 改 aria-pressed / .active
  document.addEventListener("click", (e) => {
    const item = e.target.closest(".tabs > .tab, .seg > button");
    if (!item || item.disabled) return;
    if (item.tagName === "A") e.preventDefault();
    for (const sib of item.parentElement.children) {
      if (sib.hasAttribute("aria-selected")) sib.setAttribute("aria-selected", String(sib === item));
      else if (sib.hasAttribute("aria-pressed")) sib.setAttribute("aria-pressed", String(sib === item));
      else sib.classList.toggle("active", sib === item);
    }
  });

  let n = 0;
  document.getElementById("add").onclick = () => {
    n++;
    const bar = document.createElement("div");
    bar.className = "tabs"; bar.setAttribute("role", "tablist"); bar.style.marginTop = "8px";
    bar.innerHTML = ["甲", "乙", "丙"].map((t, i) =>
      `<button class="tab" role="tab" type="button" aria-selected="${i === n % 3}">${t}${n}</button>`).join("");
    document.getElementById("dyn").append(bar);
  };
  document.getElementById("rename").onclick = () => {
    const sel = document.querySelector('#t-icons > [aria-selected="true"]');
    sel.lastChild.textContent = sel.lastChild.textContent.length > 12 ? "Preview" : "Preview（长一点）";
  };

  if (q.get("js") !== "0") {
    const { enhanceTabs } = await import("../tabs.js");
    window.tabsHandle = enhanceTabs();
    document.getElementById("mode").textContent = "已挂 tabs.js（?js=0 看纯 CSS）";
  } else {
    document.getElementById("mode").textContent = "纯 CSS（未挂 tabs.js）";
  }
</script>
</body>
</html>
